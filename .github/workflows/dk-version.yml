# DiamondKinetics-only. Bumps the version on every merge to `main`, then tags
# it — and that tag is what `dk-publish.yml` reacts to.
#
# ── Why the CLI and not `diamondkinetics/versioner@main` ──────────────────────
#
# That action lives in a private repo shared at `access_level: organization`,
# and a PUBLIC repo cannot resolve a private org action. This fork is public
# (forks of public repos always are), so the job died in "Set up job" with
# "Unable to resolve action `diamondkinetics/versioner`, not found" — before
# checkout, before any step below. Every one of the other thirteen repos using
# that action is private, so this had never been exercised.
#
# `dk-versioner` is published to CodeArtifact's dk-pypi as a console script, and
# it is the same code: the action's Dockerfile is a thin wrapper that pip
# installs the package and runs `python -m dk_versioner`. The CLI configures
# `safe.directory` and the commit identity itself, so nothing is lost by
# invoking it directly.
#
# ── Behaviour ─────────────────────────────────────────────────────────────────
#
# Increment comes from the merge commit message: nothing means a build bump
# (3.0.7 -> 3.0.8), `[minor]` gives 3.1.0, `[major]` gives 4.0.0, `[hotfix]`
# gives 3.0.7.1.
#
# The tool reads the branch from GITHUB_EVENT_NAME / GITHUB_REF_NAME and writes
# its outputs to $GITHUB_OUTPUT, all of which Actions sets. Unlike the action,
# the CLI REQUIRES --target-branch, so `main` is passed explicitly — the action
# defaulted it. Loop protection is the tool's own: it stops when the previous
# commit was already a version bump.
#
# The checkout uses a PAT rather than GITHUB_TOKEN on purpose: pushes made with
# GITHUB_TOKEN do not trigger further workflows, so the tag would never reach
# `dk-publish.yml`. checkout persists that credential, so the tool's `git push`
# uses it.

name: dk-version

on:
    push:
        branches: [main]
        tags-ignore: ['v*']

jobs:
    # Gate the bump on a green tree. Pull requests into `main` already run
    # this, but a direct push to `main` would not, and a broken version bump
    # publishes a broken package.
    quality:
        uses: ./.github/workflows/dk-quality.yml

    version:
        needs: quality
        runs-on: ubuntu-latest

        # id-token to exchange the GitHub OIDC token for AWS credentials, which
        # is what authenticates the dk-pypi install. The version commit and tag
        # are pushed with VERSIONER_TOKEN, not GITHUB_TOKEN, so `contents` does
        # not need write here.
        permissions:
            id-token: write
            contents: read

        steps:
            - name: checkout
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.VERSIONER_TOKEN }}

            - name: fetch AWS credentials
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  aws-region: us-east-1
                  role-to-assume: arn:aws:iam::626803233223:role/github-action-role

            # A managed Python rather than the runner's system one: Ubuntu 24.04
            # marks its Python externally-managed (PEP 668), so a plain
            # `pip install` there fails without --break-system-packages.
            - uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: install dk-versioner
              run: |
                  # Points pip at dk-pypi and writes an auth token.
                  aws codeartifact login --tool pip --repository dk-pypi \
                      --domain diamond-kinetics --domain-owner 626803233223 \
                      --region us-east-1

                  pip install dk-versioner

            - name: increment version
              run: |
                  versioner \
                      --target-branch main \
                      --version-file package.json \
                      --tag-pattern 'v{VERSION}' \
                      --instruction commit
