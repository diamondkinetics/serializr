# DiamondKinetics-only. Upstream's `node.js.yml` triggers on `master`, which
# this fork no longer has — its default branch is `main` so that
# `diamondkinetics/versioner` works with its stock `target-branch`. This
# provides lint/build/test on the fork's own branch.
#
# Kept as a separate `dk-`prefixed file rather than editing `node.js.yml`:
# nothing here can ever conflict with upstream, and branches cut from
# `mobxjs/master` for upstream PRs don't carry it.
#
# Single Node version on purpose — upstream's matrix of five still runs on any
# pull request opened against upstream, which is where breadth matters.
#
# Two triggers, and no `push` to main. Pull requests run this directly;
# `dk-version.yml` calls it via `workflow_call` and only bumps the version if
# it passes. A `push: branches: [main]` trigger here as well would just run
# the same jobs twice on every merge.

name: dk-quality

on:
    workflow_call:
    pull_request:
        branches: [main]

jobs:
    quality:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'

            # Dependencies are all public; this fork needs no CodeArtifact
            # credentials to install, lint, build or test.
            - name: install
              run: |
                  corepack enable
                  yarn install --immutable

            # Enabled once the six inherited eslint problems were fixed (#4,
            # sent upstream as mobxjs/serializr#197). Before that this exited
            # non-zero on code the fork had never touched.
            - name: lint
              run: yarn lint

            - name: build
              run: yarn build

            - name: test
              run: yarn test
